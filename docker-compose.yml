services:
  dynamodb:
    image: amazon/dynamodb-local
    container_name: pinpost-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8000 && echo -e 'GET / HTTP/1.1\\n\\n' >&3"]
      interval: 2s
      timeout: 2s
      retries: 30

  s3:
    # RustFS: an S3-compatible server that verifies request signatures, so the
    # presigned upload's signed Content-Length is enforced locally as it is on
    # AWS (the contract test checks this). MinIO's images now need a login to
    # pull; RustFS is Apache-2.0 and pulls anonymously from Docker Hub.
    image: rustfs/rustfs:1.0.6
    container_name: pinpost-s3
    environment:
      RUSTFS_ACCESS_KEY: pinpost
      RUSTFS_SECRET_KEY: pinpost-secret
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pinpost-objects:/data

volumes:
  pinpost-objects:
