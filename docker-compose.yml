# `docker compose up -d` runs the whole stack: Pinpost on :8787, Postgres and
# RustFS for attachments. Set PINPOST_ADMIN_EMAIL and PINPOST_ADMIN_PASSWORD
# (in the shell or a .env file next to this one) to create the first owner.
#
# For development, start only the backing services and run the server with
# `go run`: docker compose up -d --wait postgres s3

services:
  pinpost:
    build: .
    container_name: pinpost
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pinpost:pinpost@postgres:5432/pinpost?sslmode=disable
      # The server reaches RustFS by its service name; browsers upload to and
      # download from it through the published port.
      S3_ENDPOINT_URL: http://s3:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      AWS_ACCESS_KEY_ID: pinpost
      AWS_SECRET_ACCESS_KEY: pinpost-secret
      AWS_REGION: us-east-1
      PINPOST_ADMIN_EMAIL: ${PINPOST_ADMIN_EMAIL:-}
      PINPOST_ADMIN_PASSWORD: ${PINPOST_ADMIN_PASSWORD:-}
      PINPOST_ORG_NAME: ${PINPOST_ORG_NAME:-Acme}
      PINPOST_PROJECT_NAME: ${PINPOST_PROJECT_NAME:-Acme App}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "8787:8787"
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: pinpost-postgres
    environment:
      POSTGRES_USER: pinpost
      POSTGRES_PASSWORD: pinpost
      POSTGRES_DB: pinpost
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinpost -d pinpost"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pinpost-db:/var/lib/postgresql

  s3:
    # RustFS: an S3-compatible server that verifies request signatures, so the
    # presigned upload's signed Content-Length is enforced locally as it is on
    # AWS (the contract test checks this). MinIO's images now need a login to
    # pull; RustFS is Apache-2.0 and pulls anonymously from Docker Hub.
    image: rustfs/rustfs:1.0.6
    container_name: pinpost-s3
    environment:
      RUSTFS_ACCESS_KEY: pinpost
      RUSTFS_SECRET_KEY: pinpost-secret
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9000 || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pinpost-objects:/data

volumes:
  pinpost-db:
  pinpost-objects:
